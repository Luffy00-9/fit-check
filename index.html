<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Virtual Fitting Room | Apple iOS Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Apple Glassmorphism & Specular Gloss Utilities */
      .apple-glass {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(24px) saturate(190%);
        -webkit-backdrop-filter: blur(24px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05), inset 0 1px 1px 0 rgba(255, 255, 255, 0.9);
      }
      .dark .apple-glass {
        background: rgba(22, 22, 26, 0.65);
        backdrop-filter: blur(24px) saturate(190%);
        -webkit-backdrop-filter: blur(24px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.18);
      }
      
      .apple-glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.06), 0 4px 12px -2px rgba(0, 0, 0, 0.02), inset 0 1px 2px 0 rgba(255, 255, 255, 1);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .dark .apple-glass-card {
        background: rgba(18, 18, 22, 0.75);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7), inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.2);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      /* 3D Dynamic Tilt & Depth Elevate */
      .apple-3d-card {
        perspective: 1200px;
        transform-style: preserve-3d;
      }
      .apple-3d-card-hover {
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .apple-3d-card-hover:hover {
        transform: translateY(-6px) rotateX(2deg) scale(1.008);
        box-shadow: 0 24px 48px -12px rgba(99, 102, 241, 0.25), 0 8px 16px -4px rgba(0, 0, 0, 0.1), inset 0 1px 2px 0 rgba(255, 255, 255, 1);
      }
      .dark .apple-3d-card-hover:hover {
        box-shadow: 0 28px 56px -12px rgba(99, 102, 241, 0.35), 0 12px 24px -6px rgba(0, 0, 0, 0.8), inset 0 1px 2px 0 rgba(255, 255, 255, 0.25);
      }

      /* Enhanced Tactile & Responsive Buttons */
      .btn-responsive {
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        user-select: none;
      }
      .btn-responsive:hover {
        transform: translateY(-2px) scale(1.02);
      }
      .btn-responsive:active {
        transform: translateY(1px) scale(0.96);
      }

      /* 3D Push Button Depth Effect */
      .btn-3d-depth {
        box-shadow: 0 4px 0 rgba(79, 70, 229, 0.4), 0 8px 20px rgba(99, 102, 241, 0.3);
        transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .btn-3d-depth:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 rgba(79, 70, 229, 0.5), 0 12px 28px rgba(99, 102, 241, 0.4);
      }
      .btn-3d-depth:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(79, 70, 229, 0.6), 0 4px 10px rgba(99, 102, 241, 0.2);
      }

      /* Animated Sheen Sweep on Hover */
      .btn-shimmer-sweep {
        position: relative;
        overflow: hidden;
      }
      .btn-shimmer-sweep::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -60%;
        width: 50%;
        height: 200%;
        background: linear-gradient(
          60deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.35) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: rotate(25deg);
        transition: all 0.6s ease;
        pointer-events: none;
      }
      .btn-shimmer-sweep:hover::after {
        left: 140%;
      }

      .glossy-button {
        position: relative;
        overflow: hidden;
      }
      .glossy-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
        border-radius: inherit;
      }

      .glossy-shine {
        position: relative;
      }
      .glossy-shine::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18), transparent 60%);
        pointer-events: none;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              apple: {
                bg: {
                  light: '#F5F5F7',
                  dark: '#000000'
                },
                card: {
                  light: '#FFFFFF',
                  dark: '#121215'
                },
                blue: '#0071E3',
                indigo: '#6366F1'
              }
            },
            boxShadow: {
              'apple-glow': '0 0 40px -10px rgba(99, 102, 241, 0.35)',
              'apple-card': '0 12px 32px -8px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.6)',
              'apple-card-dark': '0 20px 48px -12px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.15)',
              'material-fab': '0 10px 28px -4px rgba(99, 102, 241, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4)',
            },
            animation: {
              'pulse-subtle': 'pulseSubtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 3s ease-in-out infinite',
              'shimmer': 'shimmer 2s linear infinite',
              'glow': 'glow 4s ease-in-out infinite alternate',
            },
            keyframes: {
              pulseSubtle: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0.8 },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-4px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              glow: {
                '0%': { opacity: 0.4, transform: 'scale(1)' },
                '100%': { opacity: 0.8, transform: 'scale(1.05)' },
              }
            }
          },
        },
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/"
  }
}
</script>
  </head>
  <body class="bg-[#F5F5F7] dark:bg-[#000000] text-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-300 selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
